<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width">
	<title>Solar System</title>
	<link href="style.css" rel="stylesheet" type="text/css" />
</head>
	
	<body class="space">
		<!-- container for the solar system -->
		<div id="mainContent">
			<!-- each planet is an img tag with an id of its specific self. all share class 'planets'. -->
			<img id="sun" class="planets" src="images/sun4.png" alt="sun">
			<img id="mercury" class="planets" src="images/mercury.png" alt="mercury">
			<div id="rotate_mercury" class="planets"></div>
			<img id="penus" class="planets" src="images/venus.png" alt="venus">
			<div id="rotate_penus"></div>
			<img id="earth" class="planets" src="images/earth.png" alt="earth">
			<div id="rotate_earth"></div>
			<img id="thereisnowaterinmars" class="planets" src="images/mars.png" alt="mars">
			<div id="rotate_mars"></div>
			<img id="jupiter" class="planets" src="images/jupiter.png" alt="jupiter">
			<div id="rotate_jupider"></div>
			<img id="segasaturn" class="planets" src="images/saturn.png" alt="saturn">
			<div id="rotate_saturn"></div>
			<img id="your_anus" class="planets" src="images/uranus.png" alt="uranus">
			<div id="rotate_uranus"></div>
			<img id="kingneptune" class="planets" src="images/neptune.png" alt="neptune">
			<div id="rotate_neptune"></div>
		</div>
	</body>

</html>
